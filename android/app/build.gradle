plugins { id 'com.android.application' }
android {
    namespace 'com.local.zerocloud'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.zerocloud'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '0.4.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        preview {
            if (System.getenv('ZEROCLOUD_KEYSTORE')) {
                storeFile file(System.getenv('ZEROCLOUD_KEYSTORE'))
                storePassword System.getenv('ZEROCLOUD_SIGNING_PASSWORD')
                keyAlias 'zerocloud'
                keyPassword System.getenv('ZEROCLOUD_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('ZEROCLOUD_KEYSTORE')) signingConfig signingConfigs.preview } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'onnx' }
    testOptions { animationsDisabled true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'org.opencv:opencv:4.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

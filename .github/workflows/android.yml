name: Android native preview
on:
  workflow_dispatch:
  push:
    branches: [android/native-preview]
    paths: ['android/**', 'scripts/prepare-android.mjs', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare assets
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/prepare-android.mjs
      - name: Download verified Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          EXPECTED=$(curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256)
          echo "$EXPECTED  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build and unit tests
        run: /tmp/gradle-8.13/bin/gradle -p android assembleDebug assembleRelease testDebugUnitTest assembleDebugAndroidTest --console=plain
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n zerocloud-test -k 'system-images;android-35;google_apis;x86_64' -d pixel_5
      - name: Instrumented native tests
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd zerocloud-test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82
          /tmp/gradle-8.13/bin/gradle -p android connectedDebugAndroidTest --console=plain
          adb shell am start -n com.local.zerocloud/.MainActivity
          sleep 5
          adb exec-out screencap -p > android/app/build/android-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZeroCloud-Android-debug-validation
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/android-launch.png
          retention-days: 14
